---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: prod

spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secrets
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: nodejs/mysql
        property: DB_USER
        
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: nodejs/mysql
        property: MYSQL_ROOT_PASSWORD


